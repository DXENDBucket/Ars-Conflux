plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
group = 'dev.arsconflux'
version = file('VERSION').text.trim()
base { archivesName = 'ars-conflux' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
sourceSets {
    main { java.srcDir 'common/src/main/java'; resources.srcDir 'common/src/main/resources' }
    gameTest { java.srcDir 'common/src/gameTest/java'; compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    version = '21.1.250'
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client {
            type = 'client'
            gameDirectory = file(providers.gradleProperty('glyphStatePreview').getOrElse('false').toBoolean() ? 'run/glyph-state-preview' : 'run/client')
            if (providers.gradleProperty('glyphStatePreview').getOrElse('false').toBoolean()) {
                systemProperty 'arsconflux.glyph_state_preview', 'true'
                programArguments.addAll('--width', '1100', '--height', '800')
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'arsconflux.test.allies_expected', providers.gradleProperty('alliesExpected').getOrElse('false')
            gameDirectory = file(providers.gradleProperty('gameTestRunDir').getOrElse('run/gametest'))
            if (providers.gradleProperty('simulateElementalProduction').getOrElse('false').toBoolean()) {
                programArguments.addAll('--mixin.config', 'ars_conflux_registration_tests.mixins.json')
                systemProperty 'arsconflux.test.phalanx_expected', providers.gradleProperty('phalanxExpected').getOrElse('true')
            }
        systemProperty 'neoforge.enabledGameTestNamespaces', project.findProperty('gameTestNamespaces') ?: 'ars_conflux'
        }
    }
    mods { ars_conflux { sourceSet sourceSets.main; sourceSet sourceSets.gameTest } }
}
dependencies {
    if (providers.gradleProperty('withArsNSpells').getOrElse('false').toBoolean()) {
        runtimeOnly fileTree(dir: 'libs/ars-n-spells', include: '*.jar')
    }
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    if (providers.gradleProperty('glyphStatePreview').getOrElse('false').toBoolean()) {
        runtimeOnly fileTree(dir: 'libs/glyph-state-preview', include: '*.jar')
    }
    runtimeOnly fileTree(dir: 'libs', include: '*.jar')
    // Only the independent optional-integration test runtime loads Hex and Linker.
    if (providers.gradleProperty('withHexLinker').getOrElse('false').toBoolean()) {
        runtimeOnly fileTree(dir: 'libs/hex-link', include: '*.jar')
    }
    if (providers.gradleProperty('withNeg').getOrElse('false').toBoolean()) {
        runtimeOnly fileTree(dir: 'libs/neg', include: '*.jar')
    }
    if (providers.gradleProperty('withElemental').getOrElse('false').toBoolean()) {
        runtimeOnly fileTree(dir: 'libs/elemental', include: '*.jar')
    }
    if (providers.gradleProperty('withControleAdditions').getOrElse('false').toBoolean()) {
        runtimeOnly fileTree(dir: 'libs/controle-additions', include: '*.jar')
    }
    testImplementation platform('org.junit:junit-bom:5.13.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
tasks.named('jar') { from('LICENSE', 'THIRD_PARTY_NOTICES.md'); archiveFileName = "ars-conflux-${project.version}-mc1.21.1-neoforge.jar" }
tasks.named('sourcesJar') { from('LICENSE') }
