plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.36'
    id 'org.spongepowered.mixin' version '0.7.38'
}
group = 'dev.arsconflux'
version = file('../VERSION').text.trim()
base { archivesName = 'ars-conflux' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
sourceSets.main { java.srcDir '../common/src/main/java'; resources.srcDir '../common/src/main/resources' }
sourceSets { gameTest {
    java.srcDir '../common/src/gameTest/java'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
} }
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
repositories { flatDir { dirs 'libs', 'libs/hex-link', 'libs/neg', 'libs/elemental', 'libs/controle-additions', 'libs/ars-n-spells' }; mavenCentral { content { excludeGroup 'local' } } }
jarJar.enable()
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        gameTestServer {
            jvmArgs '-Xmx'+providers.gradleProperty('gameTestHeap').getOrElse('1400m')
            workingDirectory project.file(providers.gradleProperty('gameTestRunDir').getOrElse('run/gametest'))
            property 'arsconflux.test.allies_expected', providers.gradleProperty('alliesExpected').getOrElse('false')
            property 'forge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse('ars_conflux_billing')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { ars_conflux { source sourceSets.main; source sourceSets.gameTest } }
        }
        client {
            def pagePreview = providers.gradleProperty('glyphPagePreview').getOrElse('false').toBoolean()
            workingDirectory project.file(pagePreview ? 'run/glyph-page-preview' : providers.gradleProperty('glyphStatePreview').getOrElse('false').toBoolean() ? 'run/glyph-state-preview' : 'run/client')
            if (pagePreview) {
                property 'arsconflux.glyph_page_preview', 'true'
                args '--width', '1100', '--height', '800'
            }
            if (providers.gradleProperty('glyphStatePreview').getOrElse('false').toBoolean()) {
                property 'arsconflux.glyph_state_preview', 'true'
                args '--width', '1100', '--height', '800'
            }
            mods { ars_conflux {
                source sourceSets.main
                if (pagePreview || providers.gradleProperty('glyphStatePreview').getOrElse('false').toBoolean()) source sourceSets.gameTest
            } }
        }
        server { workingDirectory project.file('run/server'); args '--nogui'; mods { ars_conflux { source sourceSets.main } } }
    }
}
mixin { add sourceSets.main, 'ars_conflux.refmap.json'; config 'ars_conflux.mixins.json' }
// MixinGradle writes annotation-processor output outside the classes directory.
// Declare it explicitly so FROM-CACHE restores the refmap as well as the classes.
tasks.named('compileJava', JavaCompile) {
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'))
            .withPropertyName('mixinRefmap')
    // MixinGradle's compile-task post-action creates this renamed archive input.
    // That action is also skipped on FROM-CACHE, so both files must be restored.
    outputs.file(layout.buildDirectory.file('tmp/compileJava/ars_conflux.refmap.json'))
            .withPropertyName('packagedMixinRefmap')
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg'))
            .withPropertyName('mixinMappings')
}
dependencies {
    if (providers.gradleProperty('withAdamsArsPlus').getOrElse('false').toBoolean()) {
        runtimeOnly fg.deobf('local:adams-ars-plus:adams1201')
    }
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    if (providers.gradleProperty('withArsNSpells').getOrElse('false').toBoolean()) {
        for (name in ['ars-n-spells', 'irons-spells-n-spellbooks', 'irons-lib', 'playeranimator']) {
            runtimeOnly fg.deobf("local:${name}:ans1201")
        }
    }
    if (providers.gradleProperty('glyphStatePreview').getOrElse('false').toBoolean() || providers.gradleProperty('glyphPagePreview').getOrElse('false').toBoolean()) {
        for (name in ['irons-spells-n-spellbooks','irons-lib','playeranimator']) {
            runtimeOnly fg.deobf("local:${name}:forge1201")
        }
        runtimeOnly fg.deobf('local:irons-nouveau:preview1201')
    }
    for (name in ['ars-nouveau','geckolib','curios','patchouli']) {
        implementation fg.deobf("local:${name}:forge1201")
    }
    if (providers.gradleProperty('withHexLinker').getOrElse('false').toBoolean()) {
        for (name in ['hexcasting', 'hex-ars-link', 'paucal', 'inline', 'caelus', 'kotlinforforge']) {
            runtimeOnly fg.deobf("local:${name}:hex1201")
        }
    }
    if (providers.gradleProperty('withNeg').getOrElse('false').toBoolean()) {
        runtimeOnly fg.deobf('local:not-enough-glyphs:neg1201')
    }
    if (providers.gradleProperty('withElemental').getOrElse('false').toBoolean()) {
        runtimeOnly fg.deobf('local:ars-elemental:elemental1201')
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'io.github.llamalad7:mixinextras-common:0.4.1'
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    jarJar('io.github.llamalad7:mixinextras-forge:0.4.1') { jarJar.ranged(it, '[0.4.1,)') }
    if (providers.gradleProperty('withControleAdditions').getOrElse('false').toBoolean()) {
        runtimeOnly fg.deobf('local:ars-controle:controle1201')
        runtimeOnly fg.deobf('local:ars-additions:additions1201')
    }
    testImplementation platform('org.junit:junit-bom:5.13.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
processResources { inputs.property 'version', project.version; filesMatching('META-INF/mods.toml') { expand(version: project.version) } }
tasks.named('jar') { from('../LICENSE', '../THIRD_PARTY_NOTICES.md'); manifest { attributes 'MixinConfigs': 'ars_conflux.mixins.json' }; finalizedBy 'reobfJar' }
tasks.named('jarJar') {
    archiveFileName = "ars-conflux-${project.version}-mc1.20.1-forge.jar"
    archiveClassifier = 'all'
    from('../LICENSE', '../THIRD_PARTY_NOTICES.md')
    manifest { attributes 'MixinConfigs': 'ars_conflux.mixins.json' }
    finalizedBy 'reobfJarJar'
}
reobf { jarJar {} }
tasks.named('sourcesJar') { from('../LICENSE') }

tasks.named('sourcesJar') { from('../THIRD_PARTY_NOTICES.md') }
['jar', 'jarJar', 'sourcesJar'].each { archive ->
    tasks.named(archive) { from('../licenses') { into 'licenses' } }
}

def verifyPackagedRefmap = { File archive ->
    new java.util.zip.ZipFile(archive).withCloseable { zip ->
        def entry = zip.getEntry('ars_conflux.refmap.json')
        if (entry == null) throw new GradleException("Missing ars_conflux.refmap.json in ${archive.name}")
        def refmap = zip.getInputStream(entry).withCloseable { stream ->
            new groovy.json.JsonSlurper().parse(stream, 'UTF-8')
        }
        def execution = refmap.mappings?.get('dev/arsconflux/mixin/ExecutionProjectilesMixin')?.get('addFreshEntity')
        if (execution != 'Lnet/minecraft/server/level/ServerLevel;m_7967_(Lnet/minecraft/world/entity/Entity;)Z'
                || refmap.data?.searge?.get('dev/arsconflux/mixin/ExecutionProjectilesMixin')?.get('addFreshEntity') != execution) {
            throw new GradleException("Missing production ServerLevel mapping in ${archive.name}")
        }
    }
}
['jar', 'jarJar'].each { archive ->
    tasks.named(archive) { doLast { verifyPackagedRefmap(archiveFile.get().asFile) } }
}
tasks.register('verifyDistributions') {
    dependsOn tasks.named('reobfJarJar')
    doLast { verifyPackagedRefmap(tasks.named('jarJar').get().archiveFile.get().asFile) }
}
tasks.named('check') { dependsOn tasks.named('verifyDistributions') }
